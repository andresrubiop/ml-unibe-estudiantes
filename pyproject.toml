[project]
name = "ml-unibe"
version = "0.1.0"
description = "Notebooks y utilidades del módulo Machine Learning · Maestría en Big Data y Ciencia de Datos · UNIB.E"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.8",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Tutoría de deep learning y sesión 2 (PyTorch); sesión 2 (Spark MLlib)
dl = ["torch>=2.6"]
spark = ["pyspark>=4.0"]

[dependency-groups]
# Solo para quien produce el material: ejecutar y verificar los notebooks
dev = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "pytest>=8",
]
lab = ["jupyterlab>=4.3"]

[tool.uv]
default-groups = ["dev"]
package = false
